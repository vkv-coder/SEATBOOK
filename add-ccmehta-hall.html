<!DOCTYPE html>
<html>
<head><title>Add CC Mehta Auditorium</title>
<style>body{font-family:Arial,sans-serif;padding:24px;max-width:600px;} button{padding:12px 28px;font-size:16px;background:#2563a8;color:#fff;border:none;border-radius:8px;cursor:pointer;} #s{margin-top:20px;font-size:14px;line-height:1.8;}</style>
</head>
<body>
<style>
#__adminGate{position:fixed;inset:0;z-index:99999;background:#f5f5f3;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
#__adminGate .gw{width:100%;max-width:380px;padding:24px;box-sizing:border-box;}
#__adminGate .gl{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:4px;text-align:center;color:#1a1a1a;}
#__adminGate .gs{font-size:12px;color:#777;margin-bottom:28px;text-align:center;}
#__adminGate .gbdg{background:#1a1a1a;color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:0.5px;}
#__adminGate .gc{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,0.08);padding:24px;}
#__adminGate .gt{font-size:15px;font-weight:600;margin-bottom:4px;color:#1a1a1a;}
#__adminGate .gd{font-size:12px;color:#777;margin-bottom:18px;}
#__adminGate input{width:100%;background:#f0eeea;border:1px solid rgba(0,0,0,0.14);border-radius:8px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:10px;box-sizing:border-box;color:#1a1a1a;}
#__adminGate button{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
#__adminGate .ge{font-size:12px;color:#cc3333;margin-top:6px;display:none;}
</style>
<div id="__adminGate">
  <div class="gw">
    <div class="gl">Khursilo.</div>
    <div class="gs"><span class="gbdg">ADMIN</span> Private access only</div>
    <div class="gc">
      <div class="gt">Admin login</div>
      <div class="gd">This page is not linked anywhere. Enter password to continue.</div>
      <input type="password" id="__gp" placeholder="Password" onkeydown="if(event.key==='Enter')__checkGate()">
      <button onclick="__checkGate()">Login &rarr;</button>
      <div class="ge" id="__ge">Incorrect password.</div>
      <div style="text-align:center;margin-top:14px;">
        <span onclick="forgotGatePin()" style="font-size:12px;color:#777;cursor:pointer;text-decoration:underline;" id="__forgotLink">Forgot PIN?</span>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var _TK='kh_adm_tk', _TX='kh_adm_tx';
  var gate = document.getElementById('__adminGate');
  var GATE_URL = 'https://jqqnnkzozjskziaizajg.supabase.co/functions/v1/kh-admin-auth';
  var GATE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg';

  async function tryAutoLogin(){
    var token = sessionStorage.getItem(_TK);
    var exp = sessionStorage.getItem(_TX);
    if(!token || !exp || new Date(exp) < new Date()){
      sessionStorage.removeItem(_TK); sessionStorage.removeItem(_TX);
      return;
    }
    try{
      var res = await fetch(GATE_URL, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+GATE_KEY},
        body: JSON.stringify({action:'verify', token:token})
      });
      var data = await res.json();
      if(data.valid){ gate.style.display='none'; }
    }catch(e){}
  }

  window.__checkGate = async function(){
    var p = document.getElementById('__gp').value;
    var result = {};
    try{
      var res = await fetch(GATE_URL, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+GATE_KEY},
        body: JSON.stringify({action:'login', pin:p})
      });
      if(res.ok) result = await res.json();
    }catch(e){}
    if(!result.token){
      document.getElementById('__ge').style.display='block';
      document.getElementById('__gp').value=''; document.getElementById('__gp').focus();
      return;
    }
    sessionStorage.setItem(_TK, result.token); sessionStorage.setItem(_TX, result.expires_at);
    gate.style.display='none';
  };

  window.adminWrite = async function(op, table, payload, filter){
    var res = await fetch(GATE_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+GATE_KEY},
      body: JSON.stringify({action:'write', token: sessionStorage.getItem(_TK), table:table, op:op, payload:payload, filter:filter})
    });
    return res.json();
  };

  window.forgotGatePin = async function(){
    var link = document.getElementById('__forgotLink');
    link.textContent = 'Sending…';
    link.style.pointerEvents = 'none';
    try{
      var res = await fetch(GATE_URL, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+GATE_KEY},
        body: JSON.stringify({action:'forgot'})
      });
      var data = await res.json();
      link.textContent = data.sent ? 'Sent to Telegram ✓' : 'Could not send — check Telegram bot config';
    }catch(e){
      link.textContent = 'Could not send — try again';
    }
    setTimeout(function(){ link.textContent = 'Forgot PIN?'; link.style.pointerEvents = ''; }, 5000);
  };

  tryAutoLogin();
})();
</script>

<h2>Add CC Mehta Auditorium — Vadodara</h2>
<p style="color:#666;font-size:13px;">524 seats · Stalls (A–F) + Balcony (G–R) · Arc/Funnel layout</p>
<button onclick="go()">Create Hall &amp; Save Layout in Supabase</button>
<div id="s"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://jqqnnkzozjskziaizajg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg'
);

const BAL = 's_balcony';
const STL = 's_stalls';

function block(count, startSn, secId) {
  return Array.from({length: count}, (_, i) => ({t:'seat', sn: startSn + i, secId}));
}

function gap() {
  return {t:'vgap', gapW:2};
}

function stallRow(label, sA, sB, sC) {
  return {type:'row', label, cells:[
    ...block(sA, 1, STL),          gap(),
    ...block(sB, sA+1, STL),       gap(),
    ...block(sC, sA+sB+1, STL)
  ]};
}

function balRow(label, sD, sE, sF, sG) {
  return {type:'row', label, cells:[
    ...block(sD, 1, BAL),              gap(),
    ...block(sE, sD+1, BAL),           gap(),
    ...block(sF, sD+sE+1, BAL),        gap(),
    ...block(sG, sD+sE+sF+1, BAL)
  ]};
}

const sections = [
  {id: STL, name:'Stalls',   color:'#2563a8', price:''},
  {id: BAL, name:'Balcony',  color:'#4338ca', price:''}
];

// Rows are ordered stage-first (A = closest to stage).
// booking.html reverses this array before rendering, so A ends up
// at the bottom (nearest the STAGE label) and R at the top.
const rows = [
  // ── STALLS (A–F, A is front row nearest stage) ──────────────────
  stallRow('A',  5, 10,  6),   // 21 seats
  stallRow('B',  6, 13,  6),   // 25 seats
  stallRow('C',  6, 14,  6),   // 26 seats
  stallRow('D',  6, 14,  6),   // 26 seats
  stallRow('E',  6, 15,  6),   // 27 seats
  stallRow('F',  4, 17,  4),   // 25 seats  (offsets in SVG preview — same seat count)

  // ── PASSAGE ─────────────────────────────────────────────────────
  {type:'hgap', label:'', cells:[]},

  // ── BALCONY (G–R, G is front of balcony, R is back row) ─────────
  balRow('G',  6,  8,  8,  6),  // 28 seats
  balRow('H',  6,  8,  8,  6),  // 28 seats
  balRow('I',  6,  8,  8,  6),  // 28 seats
  balRow('J',  6,  9,  9,  6),  // 30 seats
  balRow('K',  6,  9,  9,  6),  // 30 seats
  balRow('L',  6, 10,  9,  6),  // 31 seats
  balRow('M',  6, 10, 10,  6),  // 32 seats
  balRow('N',  6, 11, 10,  6),  // 33 seats
  balRow('O',  6, 11, 11,  6),  // 34 seats
  balRow('P',  6, 11, 11,  6),  // 34 seats
  balRow('Q',  6, 11, 11,  6),  // 34 seats
  // Row R: 2 blocks only (12 left + 20 right = 32 seats)
  {type:'row', label:'R', cells:[
    ...block(12,  1, BAL), gap(),
    ...block(20, 13, BAL)
  ]}
];

// Verify seat count before sending
const stalls = [21,25,26,26,27,25].reduce((a,b)=>a+b,0);   // 150
const balcony = [28,28,28,30,30,31,32,33,34,34,34,32].reduce((a,b)=>a+b,0); // 374
// Total = 524

const layout = {
  hall: 'CC Mehta Auditorium, Vadodara',
  sections,
  rows,
  savedAt: new Date().toISOString()
};

async function go() {
  const s = document.getElementById('s');
  s.textContent = 'Step 1: Creating hall record…';

  // Create the hall row (name + city)
  const {data: hallRows, error: e1} = await adminWrite('insert', 'kh_halls', {name: 'CC Mehta Auditorium', city: 'Vadodara'});
  const hall = hallRows && hallRows[0];

  if (e1 || !hall) {
    s.innerHTML = '<span style="color:red">Error creating hall: ' + (e1 && e1.message || 'no row returned') + '</span>';
    return;
  }

  s.textContent = 'Step 2: Saving layout (' + (stalls+balcony) + ' seats)…';

  const {error: e2} = await adminWrite('update', 'kh_halls', {layout_json: layout}, {column:'id', value: hall.id});

  if (e2) {
    s.innerHTML = '<span style="color:red">Error saving layout: ' + e2.message + '</span>';
    return;
  }

  s.innerHTML = `
    <span style="color:green;font-size:16px;font-weight:bold;">✅ CC Mehta Auditorium saved!</span><br><br>
    <strong>Hall ID:</strong> <code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;">${hall.id}</code><br>
    <strong>Seats:</strong> ${stalls} Stalls (A–F) + ${balcony} Balcony (G–R) = ${stalls+balcony} total<br>
    <strong>Sections:</strong> Stalls (#2563a8) · Balcony (#4338ca)<br><br>
    <em>Copy the Hall ID above — use it when creating events for this venue.</em>
  `;
}
</script>
</body>
</html>
