<!DOCTYPE html>
<html>
<head><title>Fix Row F — CC Mehta</title>
<style>body{font-family:Arial,sans-serif;padding:24px;max-width:600px;} button{padding:12px 28px;font-size:16px;background:#2563a8;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-right:10px;} #s{margin-top:20px;font-size:14px;line-height:1.8;white-space:pre-wrap;}</style>
</head>
<body>
<h2>Fix Row F — CC Mehta Auditorium</h2>
<p style="color:#666;font-size:13px;">Changes Row F from 4+17+4 to 3+19+3 (still 25 seats) with 3-wide decorative gaps at each edge.</p>
<p style="color:#666;font-size:13px;">New numbering: <strong>[gap] — 1,2,3 — [passage] — 4…22 — [passage] — 23,24,25 — [gap]</strong></p>
<button onclick="go()">Apply Row F Fix</button>
<div id="s"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://jqqnnkzozjskziaizajg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg'
);

const STL = 's_stalls';

function seat(sn){ return {t:'seat', sn, secId:STL}; }
function gap(w){ return {t:'vgap', gapW:w||2}; }

// New Row F: [3-wide edge gap] 1,2,3 [passage] 4..19 [passage] 20,21,22 [3-wide edge gap]
const newRowF = {
  type: 'row',
  label: 'F',
  cells: [
    gap(6),                                                          // 3-wide gap from left edge
    seat(1), seat(2), seat(3),                                       // left cluster: 3 seats
    gap(2),                                                          // passage/aisle
    seat(4),  seat(5),  seat(6),  seat(7),  seat(8),  seat(9),  seat(10),
    seat(11), seat(12), seat(13), seat(14), seat(15), seat(16),
    seat(17), seat(18), seat(19),                                    // middle: 16 seats (4-19)
    gap(2),                                                          // passage/aisle
    seat(20), seat(21), seat(22),                                    // right cluster: 3 seats
    gap(6)                                                           // 3-wide gap from right edge
  ]
};

async function go(){
  const s = document.getElementById('s');
  s.textContent = 'Fetching CC Mehta hall layout…';

  const {data:halls, error:e1} = await sb
    .from('kh_halls')
    .select('id, layout_json')
    .ilike('name','%CC Mehta%');

  if(e1 || !halls || halls.length === 0){
    s.textContent = 'ERROR fetching hall: ' + (e1?.message || 'Not found');
    return;
  }

  const hall = halls[0];
  s.textContent = 'Found hall id: ' + hall.id + '\nParsing layout…';

  let layout;
  try {
    layout = typeof hall.layout_json === 'string'
      ? JSON.parse(hall.layout_json)
      : hall.layout_json;
  } catch(e) {
    s.textContent = 'ERROR parsing layout_json: ' + e.message;
    return;
  }

  // Find and replace Row F
  const rowIdx = layout.rows.findIndex(r => r.label === 'F');
  if(rowIdx === -1){
    s.textContent = 'ERROR: Row F not found in layout!';
    return;
  }

  const oldRow = layout.rows[rowIdx];
  const oldSeatCount = oldRow.cells.filter(c => c.t === 'seat').length;
  s.textContent += '\nRow F found at index ' + rowIdx + ' — old seat count: ' + oldSeatCount;

  layout.rows[rowIdx] = newRowF;
  const newSeatCount = newRowF.cells.filter(c => c.t === 'seat').length;
  s.textContent += '\nNew seat count: ' + newSeatCount;

  // Save back
  s.textContent += '\nSaving to Supabase…';
  const {error:e2} = await sb
    .from('kh_halls')
    .update({ layout_json: layout })
    .eq('id', hall.id);

  if(e2){
    s.textContent += '\nERROR saving: ' + e2.message;
    return;
  }

  s.textContent += '\n\n✅ Done! Row F updated: [gap] 1,2,3 — [passage] — 4…19 — [passage] — 20,21,22 [gap] (22 seats total)';
  s.textContent += '\nHard refresh the booking page to see the new layout.';
}
</script>
</body>
</html>
