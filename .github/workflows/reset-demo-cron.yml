name: Nightly khursilo organiser demo reset

on:
  schedule:
    # 2:30 AM IST = 21:00 UTC the previous day (offset from the other
    # apps' jobs in the same Supabase project)
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  reset-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset_khursilo_demo RPC
        run: |
          resp=$(curl -s -w "\n%{http_code}" \
            "https://jqqnnkzozjskziaizajg.supabase.co/rest/v1/rpc/reset_khursilo_demo" \
            -H "apikey: ${{ secrets.KHURSILO_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KHURSILO_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"p_secret\": \"${{ secrets.KHURSILO_RESET_SECRET }}\"}")
          body=$(echo "$resp" | head -n -1)
          status=$(echo "$resp" | tail -n1)
          echo "Response: $body (HTTP $status)"
          if [ "$status" -ge 300 ]; then
            echo "reset call failed"
            exit 1
          fi
